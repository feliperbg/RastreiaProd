<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar Etapa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin-top: 50px; }
        .form-label { font-weight: 600; color: #495057; }
        .form-control, .form-select { border-radius: 5px; box-shadow: none; padding: 0.8rem 1rem; }
        .form-control:focus, .form-select:focus { border-color: #007bff; box-shadow: 0 0 0 0.25rem rgba(38, 143, 255, 0.25); }
        .btn-primary, .btn-secondary { border-radius: 5px; padding: 0.6rem 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Editar Etapa</h1>
        <form id="form-editar-etapa">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome da Etapa</label>
                <input type="text" id="nome" class="form-control" required />
            </div>
            <div class="mb-3">
                <label for="sequencias" class="form-label">Sequência</label>
                <input type="number" id="sequencias" class="form-control" required min="1" />
            </div>
            <div class="mb-3">
                <label class="form-label">Departamento Responsável</label>
                <div class="input-group">
                    <input type="text" id="departamentoResponsavel" class="form-control" placeholder="Nenhum" readonly />
                    <button type="button" class="btn btn-outline-secondary" id="btnSelecionarDepartamento">Selecionar</button>
                </div>
            </div>
            <div class="mb-3">
                <label for="procedimentos" class="form-label">Procedimentos</label>
                <textarea id="procedimentos" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Componente de Conclusão</label>
                <div class="input-group">
                    <input type="text" id="componenteConclusao" class="form-control" placeholder="Nenhum" readonly />
                    <button type="button" class="btn btn-outline-secondary" id="btnSelecionarComponente">Selecionar</button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Funcionários Responsáveis</label>
                <div class="input-group">
                    <input type="text" id="funcionariosResponsaveis" class="form-control" placeholder="Nenhum" readonly />
                    <button type="button" class="btn btn-outline-secondary" id="btnSelecionarFuncionarios">Selecionar</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <button type="button" class="btn btn-secondary">Cancelar</button>
        </form>
    </div>
    
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="meuToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div id="toast-body" class="toast-body"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/toast.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const pathParts = window.location.pathname.split('/');
        const id = pathParts[pathParts.length - 1];

        if (!id) {
            return exibirMensagem('ID da etapa não encontrado na URL!', 'erro');
        }

        // --- ESTRUTURA DE DADOS ---
        let produtoIdParaRedirecionar = null;
        let componenteConclusaoId = null;
        let funcionariosSelecionadosIds = [];
        let departamentoResponsavelId = null;
        let listaCompletaComponentes = [];
        let listaCompletaFuncionarios = [];
        let listaCompletaDepartamentos = [];

        async function carregarEtapa() {
            try {
                const response = await fetch(`/etapa/${id}`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` } });
                const dados = await response.json();

                if (dados.status && dados.etapa) {
                    const etapa = dados.etapa;
                    produtoIdParaRedirecionar = etapa.produto;

                    document.querySelector('.btn-secondary').onclick = () => window.location.href = `/etapa/produto/${produtoIdParaRedirecionar}`;

                    document.getElementById('nome').value = etapa.nome;
                    document.getElementById('sequencias').value = etapa.sequencias;
                    document.getElementById('procedimentos').value = etapa.procedimentos || '';

                    if (etapa.departamentoResponsavel) {
                        departamentoResponsavelId = etapa.departamentoResponsavel._id;
                        document.getElementById('departamentoResponsavel').value = etapa.departamentoResponsavel.nome;
                    }

                    if (etapa.componenteConclusao) {
                        componenteConclusaoId = etapa.componenteConclusao._id;
                        document.getElementById('componenteConclusao').value = etapa.componenteConclusao.nome;
                    }

                    if (etapa.funcionariosResponsaveis?.length > 0) {
                        funcionariosSelecionadosIds = etapa.funcionariosResponsaveis.map(f => f._id);
                        const nomes = etapa.funcionariosResponsaveis.map(f => f.nome);
                        document.getElementById('funcionariosResponsaveis').value = nomes.join(', ');
                    }
                } else {
                    exibirMensagem(dados.msg || 'Etapa não encontrada!', 'erro');
                }
            } catch (error) {
                exibirMensagem('Erro ao carregar informações da etapa.', 'erro');
            }
        }
         async function carregarListasCompletas() {
            if (listaCompletaComponentes.length > 0 && listaCompletaFuncionarios.length > 0 && listaCompletaDepartamentos.length > 0) return;
            try {
                const [compRes, funcRes, depRes] = await Promise.all([
                    fetch('/componente/readAll', { headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` } }),
                    fetch('/funcionario/readAll', { headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` } }),
                    fetch('/departamento/readAll', { headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` } })
                ]);
                if (!compRes.ok || !funcRes.ok || !depRes.ok) throw new Error("Falha ao carregar dados de seleção.");

                const compJson = await compRes.json();
                const funcJson = await funcRes.json();
                const depJson = await depRes.json();

                listaCompletaComponentes = compJson.componentes || [];
                listaCompletaFuncionarios = funcJson.funcionarios || [];
                listaCompletaDepartamentos = depJson.departamentos || [];
            } catch (error) {
                exibirMensagem("Não foi possível carregar as opções de seleção.", "erro");
            }
        }

        // --- EVENT LISTENERS PARA SELEÇÃO ---

        document.getElementById('btnSelecionarDepartamento').addEventListener('click', async function () {
            await carregarListasCompletas();
            const result = await selecionarUnico('Selecionar Departamento', listaCompletaDepartamentos, departamentoResponsavelId);
            if (result.isConfirmed) {
                departamentoResponsavelId = result.value;
                const depto = listaCompletaDepartamentos.find(d => d._id === departamentoResponsavelId);
                document.getElementById('departamentoResponsavel').value = depto ? depto.nome : '';
            }
        });

        document.getElementById('btnSelecionarComponente').addEventListener('click', async function () {
            await carregarListasCompletas();
            const result = await selecionarUnico('Selecionar Componente de Conclusão', listaCompletaComponentes, componenteConclusaoId);
            if (result.isConfirmed && result.value) {
                componenteConclusaoId = result.value;
                const componente = listaCompletaComponentes.find(c => c._id === componenteConclusaoId);
                document.getElementById('componenteConclusao').value = componente ? componente.nome : '';
            }
        });

        document.getElementById('btnSelecionarFuncionarios').addEventListener('click', async function () {
            await carregarListasCompletas();
            const result = await selecionarMultiplos('Selecionar Funcionários', listaCompletaFuncionarios, funcionariosSelecionadosIds);
            if (result.isConfirmed) {
                funcionariosSelecionadosIds = result.value;
                const nomes = listaCompletaFuncionarios
                    .filter(f => funcionariosSelecionadosIds.includes(f._id))
                    .map(f => f.nome);
                document.getElementById('funcionariosResponsaveis').value = nomes.join(', ');
            }
        });

        // --- FUNÇÕES DE MODAL (SweetAlert2) ---
        async function selecionarMultiplos(titulo, lista, selecionados) {
            return Swal.fire({
                title: titulo,
                html: `
                    <input type="text" id="swal-filtro" class="form-control mb-2" placeholder="Filtrar...">
                    <div id="swal-lista" style="max-height:300px;overflow:auto;text-align:left">
                        ${lista.map(item => `
                            <div>
                                <input type="checkbox" id="swal-${item._id}" value="${item._id}" ${selecionados.includes(item._id) ? 'checked' : ''}>
                                <label for="swal-${item._id}">${item.nome}</label>
                            </div>
                        `).join('')}
                    </div>`,
                showCancelButton: true,
                confirmButtonText: 'Selecionar',
                cancelButtonText: 'Cancelar',
                preConfirm: () => Array.from(document.querySelectorAll('#swal-lista input[type=checkbox]:checked')).map(cb => cb.value),
                didOpen: () => {
                    document.getElementById('swal-filtro').addEventListener('input', function() {
                        const val = this.value.toLowerCase();
                        document.querySelectorAll('#swal-lista label').forEach(label => {
                            label.parentElement.style.display = label.textContent.toLowerCase().includes(val) ? '' : 'none';
                        });
                    });
                }
            });
        }

        async function selecionarUnico(titulo, lista, selecionadoId) {
            return Swal.fire({
                title: titulo,
                html: `
                    <input type="text" id="swal-filtro" class="form-control mb-2" placeholder="Filtrar...">
                    <div id="swal-lista" style="max-height:300px;overflow:auto;text-align:left">
                        ${lista.map(item => `
                            <div>
                                <input type="radio" id="swal-${item._id}" value="${item._id}" name="selecaoUnica" ${selecionadoId === item._id ? 'checked' : ''}>
                                <label for="swal-${item._id}">${item.nome}</label>
                            </div>
                        `).join('')}
                    </div>`,
                showCancelButton: true,
                confirmButtonText: 'Selecionar',
                preConfirm: () => {
                    const checked = document.querySelector('#swal-lista input[type=radio]:checked');
                    return checked ? checked.value : null;
                },
                didOpen: () => { 
                    document.getElementById('swal-filtro').addEventListener('input', function() {
                        const val = this.value.toLowerCase();
                        document.querySelectorAll('#swal-lista label').forEach(label => {
                            label.parentElement.style.display = label.textContent.toLowerCase().includes(val) ? '' : 'none';
                        });
                    });
                    }
            });
        }
        document.getElementById('form-editar-etapa').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const dadosAtualizados = {
                nome: document.getElementById('nome').value,
                sequencias: parseInt(document.getElementById('sequencias').value, 10),
                departamentoResponsavel: departamentoResponsavelId,
                procedimentos: document.getElementById('procedimentos').value,
                componenteConclusao: componenteConclusaoId,
                funcionariosResponsaveis: funcionariosSelecionadosIds,
            };
            if (!dadosAtualizados.nome || !dadosAtualizados.sequencias) return exibirMensagem("Nome e Sequência são obrigatórios.", "erro");
            try {
                const response = await fetch(`/etapa/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('authToken')}` },
                    body: JSON.stringify(dadosAtualizados)
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.msg || "Erro ao atualizar a etapa.");
                
                await Swal.fire('Sucesso!', 'Etapa atualizada com sucesso.', 'success');
                if (produtoIdParaRedirecionar) {
                    window.location.href = `/etapa/produto/${produtoIdParaRedirecionar}`;
                } else {
                    window.location.href = '/produto'; // Fallback caso o ID não seja encontrado
                }
            } catch (error) {
                console.error("Erro ao atualizar etapa:", error);
                exibirMensagem(error.message, 'erro');
            }
        });

        carregarEtapa();
    });
</script>

</body>
</html>
