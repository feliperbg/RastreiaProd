<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .container h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .form-group input:focus {
            border-color: #007BFF;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        #divResposta {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recuperar Senha</h1>
        <form id="form-recuperar-senha">
            <div class="form-group">
                <label for="credential">CPF</label>
                <input type="text" id="txtCredential" name="credential" placeholder="Digite seu CPF" required>
            </div>
            <div class="form-group">
                <label for="birthdate">Data de Nascimento</label>
                <input type="date" id="data_nasc" name="birthdate" required>
            </div>
            <button type="submit" class="btn">Recuperar</button>
        </form>
        <div id="divResposta"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.6/dist/inputmask.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("form-recuperar-senha");
            const txtCredential = document.getElementById("txtCredential");
            const divResposta = document.getElementById("divResposta");

            // Aplica a máscara de CPF
            Inputmask("999.999.999-99").mask(txtCredential);

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                recuperarSenha();
            });

            function recuperarSenha() {
                const credential = txtCredential.value;
                const birthdate = document.getElementById("data_nasc").value;

                fetch('/api/funcionarios/recuperar-senha', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ credential, birthdate }),
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status) {
                        exibirMensagem(data.msg, 'sucesso');
                        window.setTimeout(() => {
                            window.location.href = '/login';
                        }, 5000); // Redireciona após 5 segundos
                    } else {
                        exibirMensagem(data.msg, 'erro');
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    exibirMensagem('Ocorreu um erro ao tentar recuperar a senha.', 'erro');
                });
            }

            function exibirMensagem(texto, tipo) {
                divResposta.innerHTML = texto;
                divResposta.style.padding = "10px";
                divResposta.style.marginTop = "10px";
                divResposta.style.borderRadius = "5px";
                divResposta.style.textAlign = "center";

                if (tipo === "sucesso") {
                    divResposta.style.backgroundColor = "#d4edda";
                    divResposta.style.color = "#155724";
                } else {
                    divResposta.style.backgroundColor = "#f8d7da";
                    divResposta.style.color = "#721c24";
                }
            }
        });
    </script>
</body>
</html>
