<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestão de Ordem de Produção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/gestao-op.css" />
</head>
<body class="p-3">
    <div class="container-fluid">
        <div id="loading-spinner" class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>

        <div id="conteudo-pagina" class="d-none">
            <div class="printable-area">
                <!-- CABEÇALHO E QR CODE -->
                <div class="row mb-4">
                    <div class="col-md-9">
                        <h2 id="op-titulo">Ordem de Produção</h2>
                        <p class="text-muted">Acompanhe o progresso e gerencie as etapas de produção.</p>
                    </div>
                    <div class="col-md-3 text-center">
                        <div id="qrcode-container"></div>
                        <small class="text-muted">Digitalize para acessar esta OS</small>
                    </div>
                </div>

                <!-- DETALHES DA ORDEM -->
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Detalhes da Ordem de Serviço</h5>
                        <div class="d-flex gap-2 no-print">
                            <button id="btn-pausar-op" class="btn btn-warning btn-sm d-none" onclick="pausarOrdemProducao()">
                                <i class="bi bi-pause-circle"></i> Pausar
                            </button>
                            <button id="btn-retomar-op" class="btn btn-info btn-sm d-none" onclick="retomarOrdemProducao()">
                                <i class="bi bi-play-circle"></i> Retomar
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="window.print()">
                                <i class="bi bi-printer"></i> Imprimir
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-lg-3 col-md-6 mb-2"><strong>Produto:</strong> <span id="op-produto"></span></div>
                            <div class="col-lg-2 col-md-6 mb-2"><strong>Quantidade:</strong> <span id="op-quantidade"></span></div>
                            <div class="col-lg-2 col-md-6 mb-2"><strong>Data de Entrega:</strong> <span id="op-data-entrega"></span></div>
                            <div class="col-lg-3 col-md-6 mb-2"><strong>Criado por:</strong> <span id="op-criado-por"></span></div>
                            <div class="col-lg-2 col-md-12 text-lg-end">
                                <strong>Status:</strong>
                                <span id="op-status"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DETALHES DO PRODUTO E COMPONENTES -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Componentes Necessários</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-bordered mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Componente</th>
                                        <th>Código</th>
                                        <th>Quantidade Necessária</th>
                                    </tr>
                                </thead>
                                <tbody id="componentes-tabela">
                                    <!-- Linhas inseridas via JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- LINHA DE PRODUÇÃO (ETAPAS) -->
                <h3 class="mt-5">Linha de Produção</h3>
                <div id="etapas-container" class="mt-4">
                    <!-- Cards das etapas inseridos via JavaScript -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- BIBLIOTECAS JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- SCRIPTS DA APLICAÇÃO -->
    <script src="/js/toast.js"></script>
    <script src="/js/tabela.js"></script> <!-- Adicionado para ter acesso às funções de formatação -->
    <script src="/js/gestao-op.js"></script>
</body>
</html>
